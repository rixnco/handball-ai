# ByteTrack configuration (Ultralytics schema, defaults of Ultralytics 8.4).
# Used by track_video(tracker="bytetrack").
tracker_type: bytetrack

# Detection thresholds: high-confidence association first, then low-confidence
# detections (>= track_low_thresh) to extend existing tracks.
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25

# Number of frames fed to the tracker a lost track survives
# (with subsample=N, that is N times more source frames).
track_buffer: 30
match_thresh: 0.8
fuse_score: true

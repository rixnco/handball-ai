[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "handball-ai"
version = "0.1.0"
description = "Computer vision pipeline for handball scouting - detection, tracking, stats, automatic action clips."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Tristan" }]
keywords = ["handball", "computer-vision", "tracking", "scouting", "sports-analytics"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "ultralytics>=8.3.0",
    "supervision>=0.25.1,<0.30",
    # Required by the Ultralytics trackers, otherwise installed at runtime.
    "lap>=0.5.12",
    "opencv-python-headless>=4.10.0.84",
    # numpy 2.x is supported by all target deps (opencv 4.10.0.84+, supervision 0.25+,
    # scikit-learn 1.5+, scipy 1.13+, polars 1.0+, pandas 2.2.2+, ultralytics 8.3+).
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    # plotly.express uses pandas.
    "pandas>=2.2.2",
    "polars>=1.0.0",
    "scipy>=1.13.0",
    "plotly>=5.20.0",
    "matplotlib>=3.8.0",
    "pillow>=9.1",
    "tqdm>=4.66.0",
    "pydantic>=2.7.0",
    "tomli>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
handball-ai = "handball_ai.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["handball_ai*"]
exclude = ["tests*", "notebooks*", "legacy*", "data*"]

[tool.setuptools.package-data]
handball_ai = ["trackers/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501", "N803", "N806"]  # allows math-style capitals (H, X) in names

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
